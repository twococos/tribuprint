[project]
name = "tribuprint"
version = "0.1.0"
description = "Servei de reprografia de la Tribu"
requires-python = ">=3.13"
dependencies = [
    "fastapi==0.162.0",
    "uvicorn==0.54.0",
    "pydantic-settings==2.16.2",
    "python-multipart==0.0.32",
    "sqlmodel==0.0.48",
    "pyipp==0.17.2",
    "pycups==2.0.4; sys_platform == 'linux'",
    "pypdf==6.21.3",
    "img2pdf==0.6.3",
    "pillow==13.0.0",
    "pillow-heif==1.8.1",
    "fpdf2==2.8.9",
    "tzdata==2026.6",
]

[dependency-groups]
dev = [
    "pytest==9.2.0",
    "httpx==0.28.1",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
